name: Stability tests
on:
  push:
    branches:
      - 'release/stability-*'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: node --test tests/stability.test.cjs
      - name: Generate initial dependency lock on stability branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/stability-')
        working-directory: app
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build: lock desktop dependency tree'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Verify locked dependencies
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund
